Builds:
  - versionName: 0.3.3-rc7
    versionCode: 21
    disable: Candidate only; full source build, scanner and asset-license audit are unverified
    commit: REPLACE_WITH_TESTED_SOURCE_COMMIT
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main"
        > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - apt-get install -y build-essential cmake doxygen meson nasm pkgconf python3-pystache
        python3-six yasm
    gradle:
      - yes
    srclibs:
      - linphone-sdk@ce38159e55897c695b7095019b5a1ff612bb181f
    prebuild:
      - echo 'org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64' >> gradle.properties
      - python3 fdroid/prepare-source.py
      - git -C $$linphone-sdk$$ submodule update --init --recursive
      - bash fdroid/build-linphone.sh prepare "$(realpath $$linphone-sdk$$)"
        "$(realpath -m $$linphone-sdk$$/../evdial-linphone-work)"
    build:
      - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - export CACHEDIR="$(realpath -m "${CACHEDIR:-${XDG_CACHE_HOME:-$HOME/.cache}/gradlew-fdroid}")"
      - gradlew-fdroid --project-dir "$$linphone-sdk$$/cmake/Android" --version
      - export LINPHONE_GRADLE="$CACHEDIR/versions/8.11.1/bin/gradle"
      - test -x "$LINPHONE_GRADLE"
      - FDROID_GRADLE_OFFLINE=0 ANDROID_NDK_HOME="$$NDK$$" bash fdroid/build-linphone.sh build
        "$(realpath $$linphone-sdk$$)" "$(realpath -m $$linphone-sdk$$/../evdial-linphone-work)"
      - printf '\nfdroid=true\nlinphoneAar=%s\n'
        "$(realpath $$linphone-sdk$$/../evdial-linphone-work/build/linphone-sdk/bin/outputs/aar/linphone-sdk-android-release.aar)"
        >> gradle.properties
    ndk: r27

MaintainerNotes: |-
  DISABLED CANDIDATE. This file is preparation for review, not evidence that
  EVDial is accepted, built or published by F-Droid. Replace the explicit commit
  placeholder with the reviewed immutable packaging commit before enabling.

  The SDK srclib already exists in fdroiddata and points to
  https://gitlab.linphone.org/BC/public/linphone-sdk.git. Tag 5.4.128 resolves to
  ce38159e55897c695b7095019b5a1ff612bb181f. Recursive source retrieval happens in
  prebuild; build-linphone.sh itself does not retrieve source or a prebuilt AAR.
  Firebase cleanup follows the official org.linphone recipe and occurs before
  the source scan. No scanignore is used to conceal the custom Maven repository.

  Provision JDK17, NDK27, Android platforms31 and35, build-tools35.0.0 and the
  SDK's required Android build tools before the build. The recipe uses the
  official gradlew-fdroid launcher to install/check Gradle 8.11.1 and passes its
  CACHEDIR executable as LINPHONE_GRADLE. The app's text-only wrapper properties
  select Gradle 8.13; no wrapper JAR is bundled. SDK AGP is
  8.0.0; app AGP is 8.7.3. LINPHONE_JOBS defaults to 2, allowed range 1..8.
  Python 3.9 or later is required by the packaging helpers.
  The helper defaults to offline; this candidate explicitly permits normal
  Maven dependency resolution while building in F-Droid's runner. Dependency
  provisioning and SDK JCenter legacy repository resolution still need a full
  build. Java 17 is installed explicitly from Debian bookworm because the
  current F-Droid VM otherwise defaults to Java 21. The app daemon is pinned
  via org.gradle.java.home, independently of the SDK's JAVA_HOME.

  Full SDK/app builds, source and binary scans, local-AAR transitive dependency
  verification, APK manifest checks and device SIP/SIM checks remain outstanding.
  The source-built AAR's SHA256 and exact preparation/tool provenance are written
  only after a successful build. Remaining EV raster resources need copyright
  and redistribution-license documentation; the app code licence alone does
  not settle them. See docs/F-DROID-ARTWORK.md. The charging dataset already
  includes its Open Charge Map CC BY 4.0 attribution in charging-license.txt.
  Local-AAR dependencies include commons-compress and AndroidX annotation
  explicitly. Optional proprietary services are declared as NonFreeNet;
  reviewers may also consider messaging shortcuts under NonFreeAdd.
  Privacy details: https://github.com/autonatoke-del/evdial/blob/main/PRIVACY.md

