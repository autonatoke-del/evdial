pluginManagement {
 repositories { google(); mavenCentral(); gradlePluginPortal() }
 def googlePlayBuild = providers.gradleProperty('googlePlay').orElse('false').get() == 'true'
 resolutionStrategy {
  eachPlugin {
   if (googlePlayBuild && requested.id.id == 'com.android.application') useVersion('8.9.1')
  }
 }
}
def fdroidBuild = providers.gradleProperty('fdroid').orElse('false').get() == 'true'
dependencyResolutionManagement {
 repositories {
  google(); mavenCentral()
  if (!fdroidBuild) {
   maven { url 'https://download.linphone.org/maven_repository' } // EVDIAL_WEBSITE_LINPHONE_MAVEN
  }
 }
}
rootProject.name = 'EVDial'
