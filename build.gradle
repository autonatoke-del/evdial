plugins { id 'com.android.application' version '8.7.3' }
android {
 namespace 'ru.autonatoke.evdial'
 compileSdk 35
 packaging { jniLibs { useLegacyPackaging = true } }
 buildToolsVersion '35.0.0'
 defaultConfig {
  applicationId 'ru.autonatoke.evdial.design'; minSdk 26; targetSdk 33; versionCode 16; versionName '0.3.3-rc2'
  manifestPlaceholders = [phoneAppLabel: 'EVDial Design']
  ndk { abiFilters 'arm64-v8a','armeabi-v7a','x86_64' }
 }
}
dependencies {
 implementation 'org.linphone.minimal:linphone-sdk-android:5.4.128'
 implementation 'androidx.media:media:1.7.0'
 implementation 'androidx.browser:browser:1.8.0'
 implementation 'com.google.protobuf:protobuf-javalite:3.25.5'
}

